###############################################################################
# Polymarket crypto Up/Down TWAP bot (15m markets, multi-asset paper/live)
###############################################################################

[GENERAL]
# Feed/trade universe. Per-asset on/off and paper/live mode are runtime
# settings on the config page (persisted in SQLite).
ASSETS = "BTC,ETH,BNB,SOL,XRP,DOGE,HYPE"
# Market cadence. Controls both the Gamma slug (``{asset}-updown-15m-{ts}``)
# and the window duration; WINDOW_SEC must match.
MARKET_INTERVAL = "15m"
WINDOW_SEC = 900
# 15m markets settle on the Chainlink 60s TWAP at the window boundary.
TWAP_WINDOW_S = 60

[FEED]
RTDS_URL = "wss://ws-live-data.polymarket.com"
CLOB_WS_URL = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
GAMMA_API = "https://gamma-api.polymarket.com"
CLOB_API = "https://clob.polymarket.com"
PRICE_BUFFER_S = 900
RECONNECT_BASE_S = 1.0
RECONNECT_MAX_S = 30.0

[WEB]
# 127.0.0.1 is safe by default. To expose the dashboard set HOST="0.0.0.0"
# and a non-empty PASSWORD (HTTP Basic auth).
HOST = "127.0.0.1"
PORT = 8037
USERNAME = "admin"
PASSWORD = ""
SESSION_TTL_S = 604800

[EXECUTION]
PAPER_TRADING = true
LIVE_ENABLED = false

[RECORDING]
# Live book/trade recorder for offline replay.  It taps the existing feeds, so
# it opens no extra WebSocket connections and sees exactly what the strategy
# sees.  Hourly gzipped JSONL under data/recordings.
# Estimate (7 assets, 1 Hz, top 10, no raw CLOB): ~60-100 MB/day compressed.
ENABLED = true
DIR = "data/recordings"
SNAPSHOT_HZ = 1.0
TOP_LEVELS = 10
# Raw CLOB messages are much larger (~5-20x).  Enable only for short,
# high-fidelity runs; the 1 Hz snapshots + trades are enough for edge analysis.
RAW_CLOB = false
RETENTION_DAYS = 30
MIN_FREE_GB = 2.0

[STRATEGY]
# Entry requires: fair - executable_ask - fee >= MIN_EDGE + MODEL_BUFFER
MIN_EDGE = 0.05
MODEL_BUFFER = 0.02
# Optional side-level gates (0 = off). MIN_FAIR drops sides whose model
# probability is too low; MIN_ENTRY_PRICE drops sides whose all-in entry price
# is too cheap (the market disagrees with an overconfident model).
MIN_FAIR = 0.0
MIN_ENTRY_PRICE = 0.0
MAX_POSITION_USD = 5.0
DAILY_LOSS_LIMIT_USD = 20.0
# Global fallback (used by BNB/SOL/XRP/DOGE/HYPE and any asset without an
# explicit table below). BTC/ETH have explicit 15m overrides.
ENTRY_MIN_REL_S = 540
ENTRY_MAX_REL_S = 870
MAX_SPREAD = 0.03
MAX_STALE_BOOK_S = 3.0
MIN_ASK_SHARES = 5.0
MIN_ORDER_SHARES = 5.0
TAKER_FEE_RATE = 0.07
SIGMA_LOOKBACK_S = 600
MIN_SIGMA_SAMPLES = 120
ENGINE_TICK_S = 0.5
SIGNAL_LOG_MIN_EDGE = 0.02

# ── Per-asset defaults ──────────────────────────────────────────────────
# Partial overrides merged over [STRATEGY]. Fields not listed inherit the
# current global value; the config page can still save per-asset overrides on
# top of these (stored in SQLite).
#
# 15m defaults from the 7-day backtest (2026-10-30 → 2026-11-06, 662-663
# windows per asset, Binance proxy + last-trade prices + 1/2/3¢ slippage).
# The gated 630-870 config stayed positive across all three slippage levels
# for BNB/DOGE/HYPE; SOL/XRP are positive but have fewer trades and a less
# stable walk-forward, so keep them paper-only until more data.
[STRATEGY.BTC]
ENTRY_MIN_REL_S = 630
# BTC keeps the earlier 630-810 window.
ENTRY_MAX_REL_S = 810
MODEL_BUFFER = 0.05
MIN_FAIR = 0.65
MIN_ENTRY_PRICE = 0.55

[STRATEGY.ETH]
ENTRY_MIN_REL_S = 630
ENTRY_MAX_REL_S = 870
MODEL_BUFFER = 0.05
MIN_FAIR = 0.65
MIN_ENTRY_PRICE = 0.55

[STRATEGY.BNB]
ENTRY_MIN_REL_S = 630
ENTRY_MAX_REL_S = 870
MODEL_BUFFER = 0.05
MIN_FAIR = 0.65
MIN_ENTRY_PRICE = 0.55

[STRATEGY.SOL]
# Fewer trades (45-57) and the 1¢ walk-forward was negative: paper only.
ENTRY_MIN_REL_S = 630
ENTRY_MAX_REL_S = 870
MODEL_BUFFER = 0.05
MIN_FAIR = 0.65
MIN_ENTRY_PRICE = 0.55

[STRATEGY.XRP]
# Positive full-sample but walk-forward turns negative at 2/3¢: paper only.
ENTRY_MIN_REL_S = 630
ENTRY_MAX_REL_S = 870
MODEL_BUFFER = 0.05
MIN_FAIR = 0.65
MIN_ENTRY_PRICE = 0.55

[STRATEGY.DOGE]
ENTRY_MIN_REL_S = 630
ENTRY_MAX_REL_S = 870
MODEL_BUFFER = 0.05
MIN_FAIR = 0.65
MIN_ENTRY_PRICE = 0.55

[STRATEGY.HYPE]
ENTRY_MIN_REL_S = 630
ENTRY_MAX_REL_S = 870
MODEL_BUFFER = 0.05
MIN_FAIR = 0.65
MIN_ENTRY_PRICE = 0.55
