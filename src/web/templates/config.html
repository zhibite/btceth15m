<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>策略配置 - BTCETH5M</title>
<link rel="stylesheet" href="/static/style.css?v=__ASSET_VERSION__">
</head>
<body>
<nav>
  <span class="brand">BTCETH5M</span>
  <a href="/">控制台</a>
  <a href="/trades">交易记录</a>
  <a href="/maker">Maker 对照</a>
  <a href="/config" class="active">策略配置</a>
  <a href="/latency">延迟监控</a>
  <div class="nav-right">
    <span id="auth-area" class="nav-auth"></span>
    <span class="live-dot offline" id="live-dot"></span>
    <span id="live-label">连接中</span>
    <span id="clock" class="mono"></span>
  </div>
</nav>

<div class="container">
  <div class="page-head">
    <div>
      <h1>策略配置</h1>
      <div class="page-sub">选择币种单独覆盖参数；未覆盖的字段继承该币种默认或全局默认</div>
    </div>
    <div class="head-meta">
      <label class="config-asset">币种
        <select id="asset-select" class="market-select"></select>
      </label>
      <div>当前模式：<b id="mode">--</b> · <span id="override-state">--</span></div>
    </div>
  </div>

  <div id="groups"><div class="no-data">加载中...</div></div>

  <div class="save-bar">
    <span class="save-msg muted" id="save-msg">没有待保存的修改</span>
    <button class="btn btn-ghost" id="reset-btn" type="button">恢复默认</button>
    <button class="btn btn-primary" id="save-btn" type="button" disabled>保存配置</button>
  </div>
</div>

<footer>BTCETH5M</footer>

<script src="/static/auth-nav.js?v=__ASSET_VERSION__"></script>
<script src="/static/config.js?v=__ASSET_VERSION__"></script>
</body>
</html>
